<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SENAI</title>
    <link rel="shortcut icon" type="image/png" href="{{ url_for('static', filename='fiep.jpg') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <img src="{{ url_for('static', filename='Captura de tela 2026-05-11 172346.png') }}" alt="Almoxarifado">
        </div>

        <div class="login-right">
            <img src="{{ url_for('static', filename='Gemini_Generated_Image_3n74o93n74o93n74.png') }}" style="margin-bottom: 24px; max-width: 300px;">

            <div class="login-header">
                <h2>Bem-vindo de volta</h2>
                <p>Insira suas credenciais para acessar o sistema.</p>
            </div>

            <form method="POST" action="/api/login">
                <div class="form-group">
                    <label for="login">Usuário *</label>
                    <input type="text" id="login" name="username" placeholder="Ex: admin.local" required>
                </div>

                <div class="form-group" style="position: relative;">
                    <label for="senha">Senha *</label>
                    <input type="password" id="senha" name="senha" placeholder="••••••••" required>
                    <i class="fa-regular fa-eye" id="togglePassword" style="position: absolute; right: 15px; bottom: 12px; cursor: pointer; color: var(--text-light); font-size: 1.1rem;"></i>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; height: 45px;">
                    Entrar no Sistema
                </button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center;">
                <a href="/criarconta" style="color: var(--primary-color); font-weight: 500; text-decoration: none;">Criar uma conta</a>
            </div>

            <div style="margin-top: auto; padding-top: 2rem; text-align: center; color: var(--text-light); font-size: 0.8rem;">
                <p>&copy; 2026 SENAI Almoxarifado. Todos os direitos reservados.</p>
            </div>
        </div>
    </div>

    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#senha');
        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

    </script>
</body>
</html>
