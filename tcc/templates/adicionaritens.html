<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Itens - SENAI</title>
    <link rel="shortcut icon" type="image/png" href="{{ url_for('static', filename='fiep.jpg') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="brand">SENAI</div>
        <div class="nav-links">
            <a href="/home">Home</a>
            <a href="/estoque">Estoque</a>
            {% if session.get('tipo') == 'adm' %}
<a href="/saidas">Registrar Saídas</a>
{% endif %}
            <a href="/" class="btn-logout">Fechar</a>
        </div>
    </nav>

    <div class="container">
        <div class="header-section">
            <h1>Adicionar Itens</h1>
            <p>Cadastre um novo produto no estoque do almoxarifado.</p>
        </div>

        <div class="content-card" style="max-width: 800px; margin: 0 auto; margin-bottom: 2rem;">
            <div class="card-header">
                <h2>➕ Dados do Item</h2>
            </div>

            <form id="formAdd" method="POST" action="/api/adicionaritem" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="nome">Nome *</label>
                    <input type="text" id="nome" name="nome" placeholder="Ex: Parafuso phillips" required>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="categoria">Categoria *</label>
                        <input type="text" id="categoria" name="categoria" placeholder="Ex: Elétrica" required>
                    </div>
                    <div class="form-group">
                        <label for="preco">Preço (R$) *</label>
                        <input type="number" step="0.01" id="preco" name="preco" placeholder="0.00" min="0" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="descricao">Descrição *</label>
                    <textarea id="descricao" name="descricao" rows="3" placeholder="Detalhes técnicos do item..." required style="width: 100%; padding: 0.75rem 1rem; border: 1px solid #ddd; border-radius: 8px; font-size: 1rem; font-family: inherit; resize: vertical;"></textarea>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="quantidade">Quantidade Inicial *</label>
                        <input type="number" id="quantidade" name="quantidade" placeholder="0" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="estoqueminimo">Estoque Mínimo *</label>
                        <input type="number" id="estoqueminimo" name="estoqueminimo" placeholder="0" min="0" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="imagem">Foto do Produto</label>
                    <input type="file" id="imagem" name="imagem" accept="image/*" style="padding: 0.5rem 1rem;">
                </div>

                <div style="display: flex; gap: 1rem; margin-top: 1rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 2;">Adicionar Item</button>
                    <a href="/home" class="btn btn-secondary" style="flex: 1; text-align: center;">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('formAdd').onsubmit = function(e) {
            e.preventDefault(); // Impede o envio imediato para mostrar o alerta
            
            Swal.fire({
                title: 'Confirmar Cadastro?',
                text: "O item será adicionado ao banco de dados.",
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Sim, adicionar!',
                cancelButtonText: 'Cancelar',
                confirmButtonColor: '#3085d6',
                cancelButtonColor: '#d33'
            }).then((result) => {
                if (result.isConfirmed) { 
                    this.submit(); // Envia o formulário se o usuário confirmar
                }
            });
        };
    </script>
</body>
</html>
